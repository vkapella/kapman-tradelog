# UI-8 (decision 13): the contrast gate. Builds the app against a seeded
# postgres, walks every audited route's rendered DOM, and fails the run on
# any text node below 4.5:1 — measured against composited backgrounds, not
# token arithmetic. `npm run check:contrast -- --self-test` proves the gate
# itself can fail; run locally before trusting a green.
name: contrast-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kapman
          POSTGRES_PASSWORD: kapman
          POSTGRES_DB: kapman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kapman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kapman:kapman@localhost:5432/kapman
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The design lint ran locally only in the theme owner's repo while the
      # consuming repos gated it in CI — three gating stories from one
      # programme. It needs no server or database; the authoring self-run is
      # a token-parity and vendor self-comparison and must stay at zero.
      - name: Design lint
        run: npm run lint:design
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - name: Start server
        run: |
          npm run start &
          npx wait-on http://localhost:3000/api/health --timeout 60000 || \
            (echo "server failed to start" && exit 1)
      - name: Contrast gate
        run: npm run check:contrast -- --report
